workflows:
  ios-workflow:
    name: ASG Projects iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "ASGProjectsApp.xcodeproj"
        XCODE_SCHEME: "ASGProjectsApp"
      xcode: latest
    scripts:
      - name: Build unsigned .app
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""
      - name: Package unsigned .ipa
        script: |
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/ASGProjectsApp.app" Payload/
          zip -r ASGProjectsApp-unsigned.ipa Payload
          mkdir -p build/ios/ipa
          mv ASGProjectsApp-unsigned.ipa build/ios/ipa/
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - itsupport@alsaifgraphics.com
        notify:
          success: true
          failure: true
